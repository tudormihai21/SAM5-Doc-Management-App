spring.application.name=DocManagement
spring.datasource.url=jdbc:postgresql://localhost:5432/docmanagement
spring.datasource.username=postgres
spring.datasource.password=WSXpl0123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.fail-on-empty-beans=false
server.port=8080

# ============================================
# Sprint 5: File Upload Configuration
# ============================================

# Local file storage directory (relative to application working directory)
# Change this path as needed for your environment
file.upload-dir=./uploads

# Maximum file sizes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# File upload timeout (in milliseconds)
spring.servlet.multipart.file-size-threshold=2KB

# ============================================
# Future: Azure Blob Storage Configuration
# Uncomment and configure when ready to migrate
# ============================================
# azure.storage.account-name=your-storage-account
# azure.storage.account-key=your-storage-key
# azure.storage.container-name=documents
# azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=...

# ============================================
# Logging Configuration
# ============================================
logging.level.com.example.docmanagement=DEBUG
logging.level.org.springframework.web.multipart=DEBUG